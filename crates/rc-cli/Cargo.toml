[package]
name = "rc-cli"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "rc-keeper command line client and headless daemon"

[[bin]]
name = "rc-keeper"
path = "src/main.rs"

[dependencies]
rc-core = { path = "../rc-core" }
rc-ipc = { path = "../rc-ipc" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
ctrlc = { version = "3", features = ["termination"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
assert_cmd = "2"

# Stand-in for `claude` in the CLI tests. Shares the source of rc-core's fake. Not installed.
[[bin]]
name = "fake-claude-cli"
path = "../rc-core/tests/fixtures/fake_claude.rs"
test = false
doc = false
