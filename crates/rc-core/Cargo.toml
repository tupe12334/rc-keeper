[package]
name = "rc-core"
version = "0.2.2"
edition = "2024"
description = "Supervisor core for rc-keeper: keeps `claude remote-control` running per folder"

[dependencies]
portable-pty = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
notify = "8.2.0"
strip-ansi-escapes = "0.2.1"
sysinfo = "0.40.1"
which = "8.0.6"

[target."cfg(unix)".dependencies]
libc = "0.2"

# Stand-in for `claude` in integration tests. Copied to a temp dir as `claude`. Not installed.
[[bin]]
name = "fake-claude"
path = "tests/fixtures/fake_claude.rs"
test = false
doc = false

[lints]
workspace = true
