[package]
name = "rc-core"
version = "0.1.0"
edition = "2024"
description = "Supervisor core for rc-keeper: keeps `claude remote-control` running per folder"

[dependencies]
portable-pty = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strip-ansi-escapes = "0.2.1"
sysinfo = "0.40.1"
uuid = { version = "1.29.0", features = ["v4"] }
which = "8.0.6"
