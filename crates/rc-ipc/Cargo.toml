[package]
name = "rc-ipc"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "IPC protocol, client and server for the rc-keeper daemon"

[dependencies]
rc-core = { path = "../rc-core" }
anyhow = "1"
dirs = "7"
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
