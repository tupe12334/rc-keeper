[package]
name = "rc-keeper-gui"
version = "0.2.1"
description = "Desktop UI and tray for rc-keeper"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rc-ipc = { path = "../crates/rc-ipc" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Own workspace root: the GUI builds with `cargo tauri build`, not with the root workspace.
[workspace]
