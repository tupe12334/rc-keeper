name: Linux build dependencies
description: Install Tauri 2 system packages on Ubuntu runners.

runs:
  using: composite
  steps:
    - name: Install Tauri 2 packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential curl wget file
